[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "algo-pkg"
version = "0.1.0"
description = "Paquete de ejemplo con algoritmo configurable"
requires-python = ">=3.9"
authors = [{name = "Diego", email = "diego@example.com"}]
readme = "README.md"
license = {text = "MIT"}
keywords = ["algorithm", "configurable", "example"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ruff>=0.17.1",
]

[project.urls]
Homepage = "https://example.com/algo-pkg"
Repository = "https://github.com/diego/algo-pkg"

[tool.uv]
# Opcionales: especificar dependencias de desarrollo o extras
# dev-dependencies = ["pytest", "black"]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"] 
